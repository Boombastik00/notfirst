[project]
name = "notfirst-backend"
version = "0.1.0"
description = "не первая — api платформы женских историй"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "sqladmin>=0.19",
    "httpx>=0.27",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx2>=2.16.2",
    "pytest-asyncio>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# в тестах допустим широкий перехват: пропуск когда postgres недоступен
"tests/conftest.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
